[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "ISC",
    "MPL-2.0",
    "BSD-3-Clause",
    "Unicode-3.0",
    "AGPL-3.0-or-later",
    "Apache-2.0 WITH LLVM-exception"
]

[advisories]
ignore = [
    "RUSTSEC-2023-0089"
]

[bans]
multiple-versions = "allow"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"

[bans]
multiple-versions = "warn"

[[bans.skip]]
name = "orvpass-core"
