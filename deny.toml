[bans]
multiple-versions = "warn"

[licenses]
confidence-threshold = 0.8

allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "Unicode-3.0",
    "Zlib",
    "BSL-1.0",
    "MPL-2.0",
    "ISC",
    "CC0-1.0"
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
