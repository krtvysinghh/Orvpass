name: 'Publish Pure Rust CLI & TUI Binary Releases'

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-binaries:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-apple-darwin
            os: macos-latest
            asset_name: orvpass-v5.0.0-macos-x86_64.tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            asset_name: orvpass-v5.0.0-macos-arm64.tar.gz
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            asset_name: orvpass-v5.0.0-linux-x86_64.tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            asset_name: orvpass-v5.0.0-windows-x86_64.zip

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build Binary
        run: cargo build --release -p orvpass-cli --target ${{ matrix.target }}

      - name: Package Unix Archive
        if: matrix.os != 'windows-latest'
        run: |
          mkdir -p release_assets
          cp target/${{ matrix.target }}/release/orvpass orvpass
          tar -czf release_assets/${{ matrix.asset_name }} orvpass README.md LICENSE
          cd release_assets && sha256sum ${{ matrix.asset_name }} > ${{ matrix.asset_name }}.sha256

      - name: Package Windows Archive
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          mkdir -p release_assets
          cp target/${{ matrix.target }}/release/orvpass.exe orvpass.exe
          7z a release_assets/${{ matrix.asset_name }} orvpass.exe README.md LICENSE
          cd release_assets && certutil -hashfile ${{ matrix.asset_name }} SHA256 > ${{ matrix.asset_name }}.sha256

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          files: release_assets/*
          fail_on_unmatched_files: false
