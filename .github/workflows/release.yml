name: 'Publish Desktop & Mobile Releases'
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: ''
          - platform: 'ubuntu-22.04'
            args: ''
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: install frontend dependencies
        working-directory: desktop/app
        run: npm install

      - name: build tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop/app
          tagName: ${{ github.ref_name }}
          releaseName: 'Orvpass ${{ github.ref_name }}'
          releaseBody: 'See the assets below for the latest installers.'
          releaseDraft: true
          prerelease: false

  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: setup java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: setup android sdk
        uses: android-actions/setup-android@v3

      - name: install NDK
        run: sdkmanager "ndk;25.2.9519653"

      - name: install frontend dependencies
        working-directory: desktop/app
        run: npm install

      - name: build android apk
        working-directory: desktop/app
        run: |
          npm run tauri android init
          cp -r src-tauri/icons/android/* src-tauri/gen/android/app/src/main/res/ || true
          sed -i 's/"app_name">.*</"app_name">Orvpass</' src-tauri/gen/android/app/src/main/res/values/strings.xml || true
          npm run tauri android build

      - name: Sign APK
        working-directory: desktop/app
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > orvpass.p12
          BUILD_TOOLS=$(ls -d $ANDROID_HOME/build-tools/* | tail -1)
          $BUILD_TOOLS/apksigner sign --ks orvpass.p12 --ks-type pkcs12 --ks-pass "pass:$KEYSTORE_PASSWORD" --key-pass "pass:$KEY_PASSWORD" --ks-key-alias "$KEY_ALIAS" src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release-unsigned.apk
          mv src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release-unsigned.apk src-tauri/gen/android/app/build/outputs/apk/universal/release/Orvpass.apk
          rm orvpass.p12

      - name: Release APK
        uses: softprops/action-gh-release@v2
        with:
          files: desktop/app/src-tauri/gen/android/app/build/outputs/apk/universal/release/*.apk
