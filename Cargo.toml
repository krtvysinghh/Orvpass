[workspace]
members = [
"core",
"cli",
"desktop/src-tauri",
"sdk",
"sync-server"
]

resolver = "2"

[workspace.dependencies]
argon2 = "0.5"
aes-gcm = "0.10"
chacha20poly1305 = "0.10"
sha2 = "0.10"
rand = "0.8"
rand_core = "0.6"
base64 = "0.22"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tokio = { version = "1", features = ["full"] }
axum = "0.8"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
