[workspace]
resolver = "2"
members = [
    "core",
    "cli"
]


[workspace.package]
edition = "2021"
version = "0.1.0"
authors = ["Kartavya Singh"]
license = "MIT"


[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
zeroize = { version = "1", features = ["derive"] }
argon2 = "0.5"
chacha20poly1305 = "0.10"
hkdf = "0.12"
sha2 = "0.10"
rand = "0.9"
clap = { version = "4", features = ["derive"] }
dialoguer = "0.11"

uuid = { version = "1", features = ["v4", "serde"] }
time = { version = "0.3", features = ["serde"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
