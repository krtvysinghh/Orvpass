<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 340px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      font-size: 13px;
      user-select: none;
    }
    .header {
      padding: 14px 16px;
      background: #1e293b;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .brand-icon {
      width: 24px;
      height: 24px;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: bold;
      color: white;
    }
    .brand-title {
      font-size: 14px;
      font-weight: 700;
      letter-spacing: -0.3px;
    }
    .status-badge {
      font-size: 10px;
      padding: 3px 8px;
      border-radius: 12px;
      background: rgba(16, 185, 129, 0.15);
      color: #10b981;
      font-weight: 600;
    }
    .tabs {
      display: flex;
      background: #1e293b;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      padding: 4px 8px;
    }
    .tab-btn {
      flex: 1;
      padding: 8px 0;
      background: transparent;
      border: none;
      color: #94a3b8;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      border-radius: 6px;
      transition: all 0.2s;
    }
    .tab-btn.active {
      background: #334155;
      color: #fff;
    }
    .search-box {
      padding: 12px 14px;
    }
    .search-box input {
      width: 100%;
      padding: 8px 12px;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.12);
      background: #1e293b;
      color: #fff;
      font-size: 12px;
      outline: none;
    }
    .search-box input:focus {
      border-color: #6366f1;
    }
    .list {
      max-height: 280px;
      overflow-y: auto;
      padding: 0 14px 14px;
    }
    .item {
      padding: 10px 12px;
      border-radius: 12px;
      background: #1e293b;
      border: 1px solid rgba(255,255,255,0.06);
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: background 0.15s;
    }
    .item:hover {
      background: #273549;
    }
    .item-title {
      font-weight: 600;
      font-size: 13px;
      color: #f8fafc;
    }
    .item-user {
      font-size: 11px;
      color: #94a3b8;
      font-family: ui-monospace, SFMono-Regular, monospace;
      margin-top: 2px;
    }
    .actions {
      display: flex;
      gap: 6px;
    }
    .btn {
      padding: 5px 10px;
      border-radius: 8px;
      border: none;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
    }
    .btn-primary {
      background: #6366f1;
      color: #fff;
    }
    .btn-primary:hover { background: #4f46e5; }
    .btn-secondary {
      background: #334155;
      color: #cbd5e1;
    }
    .btn-secondary:hover { background: #475569; color: #fff; }
    
    /* Generator tab */
    .gen-panel {
      padding: 14px;
      display: none;
    }
    .gen-output {
      padding: 10px;
      background: #1e293b;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.1);
      font-family: monospace;
      font-size: 13px;
      color: #818cf8;
      word-break: break-all;
      margin-bottom: 12px;
      text-align: center;
    }
    .gen-controls {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="brand">
      <div class="brand-icon">🛡️</div>
      <div class="brand-title">Orvpass</div>
    </div>
    <div class="status-badge" id="vaultStatusBadge">● Active</div>
  </div>

  <div class="tabs">
    <button class="tab-btn active" id="tabVault">Vault</button>
    <button class="tab-btn" id="tabGen">Generator</button>
  </div>

  <div id="vaultView">
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="Search passwords & passkeys (⌘Shift+L)..." />
    </div>
    <div class="list" id="vaultList"></div>
  </div>

  <div id="genView" class="gen-panel">
    <div class="gen-output" id="genResult">Loading...</div>
    <div class="gen-controls">
      <button class="btn btn-primary" id="btnCopyGen">Copy to Clipboard</button>
      <button class="btn btn-secondary" id="btnRegen">Generate New (Diceware / High Entropy)</button>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
