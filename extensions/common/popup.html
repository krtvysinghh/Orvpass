<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 300px;
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #18181b;
      color: #fff;
    }
    .header {
      padding: 12px 16px;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .header h1 {
      margin: 0;
      font-size: 16px;
      font-weight: 600;
    }
    .search {
      padding: 12px 16px;
    }
    .search input {
      width: 100%;
      box-sizing: border-box;
      padding: 8px 12px;
      border-radius: 6px;
      border: 1px solid rgba(255,255,255,0.2);
      background: rgba(0,0,0,0.3);
      color: white;
      outline: none;
    }
    .search input:focus {
      border-color: #3b82f6;
    }
    .list {
      max-height: 300px;
      overflow-y: auto;
      padding: 0 16px 16px;
    }
    .item {
      padding: 10px;
      border-radius: 8px;
      background: rgba(255,255,255,0.05);
      margin-bottom: 8px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .item:hover {
      background: rgba(255,255,255,0.1);
    }
    .item-title {
      font-weight: 500;
      font-size: 14px;
    }
    .item-user {
      font-size: 12px;
      color: #9ca3af;
    }
    .autofill-btn {
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 4px;
      padding: 4px 8px;
      font-size: 12px;
      cursor: pointer;
    }
    .autofill-btn:hover {
      background: #1d4ed8;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>Orvpass</h1>
    <span style="font-size: 12px; color: #10b981;">● Connected</span>
  </div>
  <div class="search">
    <input type="text" id="searchInput" placeholder="Search vault..." />
  </div>
  <div class="list" id="vaultList">
    <!-- Items populated by JS -->
  </div>
  <script src="popup.js"></script>
</body>
</html>
